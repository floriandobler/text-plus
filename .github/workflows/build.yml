name: Build

on:
  push:
    branches: [main, v2]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux-tests:
    name: Tests (Linux, Mesa)
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libglew-dev libegl-dev libegl-mesa0 libgl1-mesa-dri \
            fonts-dejavu-core fonts-cantarell fonts-inter python3 libcurl4-openssl-dev
      - name: Build and test
        run: ./scripts/run_tests_linux.sh

  macos:
    name: macOS universal bundle
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DPLUS_BUILD_TESTS=ON
          cmake --build build-mac --config Release --parallel
          for B in TextPlus TextPlusFX; do
            codesign --force --sign - build-mac/$B.bundle
            lipo -info build-mac/$B.bundle/Contents/MacOS/$B
            codesign --verify --verbose build-mac/$B.bundle
          done

      - name: Smoke test (loads the bundle like Resolume, renders with Apple's OpenGL 4.1)
        run: |
          mkdir -p smoke
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle --list | head -n 30
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/outline_glow.png 1280 720 \
            "Text=Text+ on macOS" "Text 2=CoreText fonts, Apple GL" "L2 Style=1" "L2 Size=40" "L2 Color=0.1" "L2 Color_Alpha=1" \
            "Size=140" "Outline Width=18" "Outline 2 Width=8" "Glow Radius=40" "Shadow Distance=12" @expectInk=1
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/fade_layers.png 1280 360 \
            "Text=merged outlines" "Size=120" "Outline Width=16" "A1 Mode=1" "A1 Opacity=0" "A1 Spread=2" "A1 Progress=0.6" @expectInk=1
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/csv.png 960 300 \
            "Text File=plugins/textplus/tests/data/lower_thirds.csv" "Slide=0.9" "L2 Style=1" "L2 Size=50" @expectInk=1 @print=Slide
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/plates.png 1280 400 \
            "Text=Anna Musterfrau" "Text 2=REGIE & LICHT" "Font=Helvetica Neue / Bold" "Size=90" "Align=0" "L2 Style=1" "L2 Size=45" \
            "Plate=2" "Plate Radius=10" "Shadow Distance=8" @expectInk=1
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/fallback.png 1280 300 \
            "Text=Emoji 🎉 1️⃣ 中文 日本語 한국어 עברית" "Font=Helvetica Neue / Regular" "Size=70" "Outline Width=4" @expectInk=1 @frames=40
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/ticker.png 1280 200 \
            "Display=3" "Text=Ticker on macOS" "Scroll Speed=300" "Plate=1" @dt=0.05 @frames=30 @expectInk=1
          # 2.0: panel, migration, looks, 3D, paths, live data, Text+ FX, web over HTTPS (NSURLSession)
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/panel.png 640 360 "@ui=smoke/panel.txt" @frames=4
          grep -q "^22 rows in 7 groups" smoke/panel.txt
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/looks.png 1280 300 \
            "Text=Retro 3D" "Font=Helvetica Neue / Bold" "Size=140" "+Look=9" @expectInk=1 @frames=20
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/chrome.png 1280 300 \
            "Text=Chrome" "Font=Helvetica Neue / Bold" "Size=160" "+Look=8" @expectInk=1 @frames=20
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/ring.png 960 400 \
            "Text=SPINNING RING · MACOS · " "Size=60" "Path=4" "Path Tilt=15" "+Look=7" @expectInk=1 @frames=20
          # Diagnostics for 3D animators on Apple's renderer (prints the ink of each variant)
          N=0
          for V in "A1 Mode=1|A1 Rotation X=90|A1 Progress=0.5" "A1 Mode=1|A1 Rotation X=90|A1 Progress=1" \
                   "A1 Mode=1|A1 Opacity=0|A1 Progress=0.5" "A1 Mode=1|A1 Opacity=0|A1 Progress=1" "A1 Mode=1|A1 Depth=800|A1 Progress=0.5" \
                   "A1 Mode=1|A1 Skew=30|A1 Progress=0.5" "A1 Mode=1|A1 Rotation Y=90|A1 Progress=0.5" "A1 Mode=5|A1 Opacity=50|A1 Progress=1" \
                   "A1 Mode=5|A1 Rotation X=40|A1 Progress=1" "A1 Mode=1|A1 Offset Y=100|A1 Progress=0.5" "Path=4" "Path=4|A1 Mode=1|A1 Opacity=0|A1 Progress=0.5"; do
            N=$((N+1))
            IFS='|' read -ra A <<< "$V"
            echo "variant $N: $V"
            ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/diag_$N.png 960 300 "Text=FLIP IN 3D" "Size=110" "${A[@]}" @frames=30 @expectInk=1 | grep -E "ink" || true
          done
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/flip.png 960 300 \
            "Text=FLIP IN 3D" "Size=110" "+A1 Preset=19" "++A1 Progress=0.5" @expectInk=1 @frames=20 "@print=A1 Mode,A1 Rotation X,A1 Progress,A1 Opacity"
          ./build-mac/ffgl_test_host build-mac/TextPlus.bundle smoke/web.png 1280 300 \
            "Source=3" "URL=https://api.github.com/repos/floriandobler/text-plus" "Text={full_name} · {stargazers_count} stars" \
            "Size=60" @frames=300 "@print=Refresh" || true
          for IM in 0 1 2; do
            ./build-mac/ffgl_test_host build-mac/TextPlusFX.bundle smoke/fx_$IM.png 1280 360 @input=1 "Input=$IM" \
              "Text=Text+ FX" "Size=160" "+Effect 1=1" @expectInk=1 @frames=16
          done
          python3 plugins/textplus/tests/fuzz_params.py build-mac/ffgl_test_host build-mac/TextPlus.bundle 15
          python3 plugins/textplus/tests/fuzz_params.py build-mac/ffgl_test_host build-mac/TextPlusFX.bundle 5

      - name: Package
        run: |
          VERSION=$(sed -nE 's/^project\(ResolumePlus VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          mkdir -p dist/TextPlus
          cp -R build-mac/TextPlus.bundle build-mac/TextPlusFX.bundle dist/TextPlus/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/TextPlus/
          cat > dist/TextPlus/INSTALL.txt <<TXT
          Text+ ${VERSION} for Resolume Arena / Avenue 7 (macOS 11+, Apple Silicon and Intel)

          1. Copy TextPlus.bundle and TextPlusFX.bundle to ~/Documents/Resolume Arena/Extra Effects
             (or Resolume Avenue; see Preferences > Video > FFGL for your plugin folder).
          2. The bundles are not notarised. Remove the download quarantine once in Terminal:
             xattr -dr com.apple.quarantine ~/Documents/"Resolume Arena"/"Extra Effects"/TextPlus*.bundle
          3. Restart Resolume. Text+ is listed under Sources, Text+ FX under Effects.

          Documentation: https://github.com/${{ github.repository }}
          TXT
          (cd dist && ditto -c -k --keepParent TextPlus "TextPlus-${VERSION}-macOS.zip")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: TextPlus-macOS
          path: dist/TextPlus-*-macOS.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-renders
          path: smoke/*.png

      # A published release (or a pushed v* tag) gets the zip attached.
      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: Text+ ${{ env.VERSION }}
          body_path: docs/releases/v${{ env.VERSION }}.md
          files: dist/TextPlus-*-macOS.zip

  windows:
    name: Windows x64 DLL (not yet tested in Resolume)
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC)
        shell: bash
        run: |
          cmake -S . -B build-win -A x64 -DPLUS_BUILD_TESTS=ON
          cmake --build build-win --config Release --parallel
          ls -la build-win/*.dll build-win/*.exe

      # GitHub's Windows machines have no GPU: Mesa's llvmpipe provides OpenGL 4.5
      # in software when its opengl32.dll sits next to the test host.
      - name: Software OpenGL (Mesa for Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern '*-release-msvc.7z' --dir mesa
          ls mesa
          7z x mesa/*.7z -omesa/x > /dev/null
          cp mesa/x/x64/*.dll build-win/

      - name: Smoke test (loads the DLL like Resolume, renders with Mesa)
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p smoke
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll --list | head -n 30
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll smoke/outline_glow.png 1280 720 \
            "Text=Text+ on Windows" "Text 2=DirectWrite fallback, Mesa GL" "L2 Style=1" "L2 Size=40" "L2 Color=0.1" "L2 Color_Alpha=1" \
            "Font=Arial / Bold" "Size=140" "Outline Width=18" "Outline 2 Width=8" "Glow Radius=40" "Shadow Distance=12" @expectInk=1
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll smoke/plates.png 1280 400 \
            "Text=Anna Musterfrau" "Text 2=REGIE & LICHT" "Font=Segoe UI / Bold" "Size=90" "Align=0" "L2 Style=1" "L2 Size=45" \
            "Plate=2" "Plate Radius=10" "Shadow Distance=8" @expectInk=1
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll smoke/fallback.png 1280 300 \
            "Text=Emoji 🎉 1️⃣ 中文 日本語 한국어" "Font=Arial / Regular" "Size=70" "Outline Width=4" @expectInk=1 @frames=40
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll smoke/csv.png 960 300 \
            "Text File=plugins/textplus/tests/data/lower_thirds.csv" "Slide=0.9" "L2 Style=1" "L2 Size=50" @expectInk=1 @print=Slide
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll smoke/ticker.png 1280 200 \
            "Display=3" "Text=Ticker on Windows" "Scroll Speed=300" "Plate=1" @dt=0.05 @frames=30 @expectInk=1
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll smoke/panel.png 640 360 "@ui=smoke/panel.txt" @frames=4
          grep -q "^22 rows in 7 groups" smoke/panel.txt
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll smoke/looks.png 1280 300 \
            "Text=Retro 3D" "Font=Arial / Bold" "Size=140" "+Look=9" @expectInk=1 @frames=20
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll smoke/ring.png 960 400 \
            "Text=SPINNING RING · WINDOWS · " "Font=Arial / Bold" "Size=60" "Path=4" "+Look=7" @expectInk=1 @frames=20
          ./build-win/ffgl_test_host.exe build-win/TextPlus.dll smoke/web.png 1280 300 \
            "Source=3" "URL=https://api.github.com/repos/floriandobler/text-plus" "Text={full_name} · {stargazers_count} stars" \
            "Font=Arial / Bold" "Size=60" @frames=300 "@print=Refresh" || true
          for IM in 0 1 2; do
            ./build-win/ffgl_test_host.exe build-win/TextPlusFX.dll smoke/fx_$IM.png 1280 360 @input=1 "Input=$IM" \
              "Text=Text+ FX" "Font=Arial / Bold" "Size=160" "+Effect 1=1" @expectInk=1 @frames=16
          done
          python plugins/textplus/tests/fuzz_params.py build-win/ffgl_test_host.exe build-win/TextPlus.dll 10
          python plugins/textplus/tests/fuzz_params.py build-win/ffgl_test_host.exe build-win/TextPlusFX.dll 4

      - name: Package
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^project\(ResolumePlus VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          mkdir -p dist/TextPlus
          cp build-win/TextPlus.dll build-win/TextPlusFX.dll dist/TextPlus/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/TextPlus/
          cat > dist/TextPlus/INSTALL.txt <<TXT
          Text+ ${VERSION} for Resolume Arena / Avenue 7 on Windows (x64)

          NOT YET TESTED IN RESOLUME ON WINDOWS. It builds and passes the automated
          tests (software OpenGL); please report problems in the GitHub issues.

          1. Copy TextPlus.dll and TextPlusFX.dll to Documents\Resolume Arena\Extra Effects
             (or Resolume Avenue; see Preferences > Video > FFGL for your plugin folder).
          2. Restart Resolume. Text+ is listed under Sources, Text+ FX under Effects.

          Requires the Microsoft Visual C++ 2015-2022 runtime (x64), which Resolume installs.
          Documentation: https://github.com/${{ github.repository }}
          TXT
          (cd dist && 7z a -tzip "TextPlus-${VERSION}-Windows.zip" TextPlus > /dev/null)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: TextPlus-Windows
          path: dist/TextPlus-*-Windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-renders-windows
          path: smoke/*.png

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/TextPlus-*-Windows.zip
